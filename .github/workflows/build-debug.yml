name: build-debug

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore keystore
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "HOME=$HOME"
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-<unset>}"
          echo "ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-<unset>}"
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            chmod 600 ~/.android/debug.keystore
            cp ~/.android/debug.keystore ci-debug.keystore
            echo "keystore restored: $(wc -c < ci-debug.keystore) bytes"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK signature matches fixed keystore
        run: |
          [ -f ci-debug.keystore ] || { echo "no fixed keystore, skip"; exit 0; }
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found, skip"; exit 0; fi
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          APK_SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -oP 'SHA-256 digest: \K[0-9a-f]+' | head -1)
          KS_SHA=$(keytool -exportcert -keystore ci-debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | sha256sum | awk '{print $1}')
          echo "APK signer SHA-256: $APK_SHA"
          echo "Keystore  SHA-256: $KS_SHA"
          if [ "$APK_SHA" != "$KS_SHA" ]; then
            echo "::error::APK signature does NOT match fixed keystore!"
            exit 1
          fi
          echo "signature OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autoclicker-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
